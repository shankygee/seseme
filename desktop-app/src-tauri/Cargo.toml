[package]
name = "live-agent-screen"
version = "0.1.0"
description = "Live Agent Screen Companion"
authors = ["Sesame AI Labs"]
license = "Apache-2.0"
repository = ""
edition = "2021"

[lib]
name = "live_agent_screen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
base64 = "0.21"
image = "0.24"
chrono = "0.4"
reqwest = { version = "0.11", features = ["json", "stream"] }
futures = "0.3"
parking_lot = "0.12"
once_cell = "1.19"

# macOS specific dependencies
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
cocoa = "0.25"
core-graphics = "0.23"
core-foundation = "0.9"
dispatch = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
